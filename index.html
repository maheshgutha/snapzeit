<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapZeit - Find Professional Photographers Near You</title>
    <meta name="description" content="Book professional photographers for weddings, events, portraits, and more. Browse portfolios, compare prices, and book instantly with SnapZeit." />
    <meta name="author" content="SnapZeit" />
    <meta name="keywords" content="photography, photographer booking, wedding photographer, event photographer, portrait photography, professional photos" />
    <link rel="canonical" href="https://snapzeit.com" />
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://api.snapzeit.com" />
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/png" href="/assets/snapzeit-logo.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/assets/snapzeit-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#3B82F6" />
    <meta name="msapplication-TileColor" content="#3B82F6" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="SnapZeit - Find Professional Photographers Near You" />
    <meta property="og:description" content="Book professional photographers for weddings, events, portraits, and more. Browse portfolios, compare prices, and book instantly." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://snapzeit.com/assets/snapzeit-og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://snapzeit.com" />
    <meta property="og:site_name" content="SnapZeit" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@SnapZeit" />
    <meta name="twitter:creator" content="@SnapZeit" />
    <meta name="twitter:title" content="SnapZeit - Find Professional Photographers" />
    <meta name="twitter:description" content="Book professional photographers for weddings, events, portraits, and more." />
    <meta name="twitter:image" content="https://snapzeit.com/assets/snapzeit-og-image.jpg" />
    
    <!-- Additional SEO Meta Tags -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <meta name="rating" content="general" />
    <meta name="distribution" content="global" />
    <meta name="language" content="English" />
    <meta name="geo.region" content="US" />
    <meta name="geo.placename" content="United States" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SnapZeit",
      "description": "Professional photographer booking platform",
      "url": "https://snapzeit.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://snapzeit.com/photographers?search={search_term_string}",
        "query-input": "required name=search_term_string"
      },
      "sameAs": [
        "https://facebook.com/snapzeit",
        "https://twitter.com/snapzeit",
        "https://instagram.com/snapzeit",
        "https://linkedin.com/company/snapzeit"
      ]
    }
    </script>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SnapZeit",
      "description": "Professional photographer booking platform connecting clients with verified photographers worldwide",
      "url": "https://snapzeit.com",
      "logo": "https://snapzeit.com/assets/snapzeit-logo.png",
      "foundingDate": "2024",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-800-SNAPZEIT",
        "contactType": "customer service",
        "availableLanguage": ["English", "Spanish", "French", "German", "Japanese"]
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "US"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "reviewCount": "10000",
        "bestRating": "5",
        "worstRating": "1"
      },
      "serviceArea": {
        "@type": "GeoShape",
        "name": "Worldwide"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
